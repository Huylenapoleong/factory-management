services:
  postgres:
    image: postgres:18-alpine
    container_name: factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-factory_db}
      POSTGRES_USER: ${DB_USERNAME:-factory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_factory_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-factory_user} -d ${DB_NAME:-factory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/huylenapoleong/factory-backend:latest}
    container_name: factory-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-factory_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-factory_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me_factory_password_2026}
      APP_JWT_SECRET: ${JWT_SECRET:-change_me_super_secret_key_factory_management_2026_at_least_32_bytes_long!}
      APP_JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      APP_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://factory.wiai.vn,https://factory.wiai.vn}
      APP_NAME: ${APP_NAME:-Smart Factory}
      COMPANY_NAME: ${COMPANY_NAME:-ABC Manufacturing Co., Ltd.}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      SUPPORTED_LANGUAGES: ${SUPPORTED_LANGUAGES:-en,zh-CN}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      FEATURE_INVENTORY: ${FEATURE_INVENTORY:-true}
      FEATURE_PURCHASING: ${FEATURE_PURCHASING:-true}
      FEATURE_PRODUCTION: ${FEATURE_PRODUCTION:-true}
      FEATURE_SALES: ${FEATURE_SALES:-true}
      FEATURE_REPORTING: ${FEATURE_REPORTING:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - factory-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/huylenapoleong/factory-frontend:latest}
    container_name: factory-frontend
    restart: unless-stopped
    networks:
      - factory-network

  nginx:
    image: nginx:alpine
    container_name: factory-nginx
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-3977}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - factory-network

volumes:
  postgres_data:
    driver: local

networks:
  factory-network:
    driver: bridge

